[project]
name = "kaggriculture-agent"
version = "0.1.0"
description = "Agent for the Kaggriculture Kaggle Simulations competition"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments>=1.32.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kaggriculture_agent*"]
where = ["src"]
